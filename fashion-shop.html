<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOIRE — Оболочки на любой вкус</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #080808;
  --bg2:     #0e0e0e;
  --bg3:     #141414;
  --border:  #1e1e1e;
  --border2: #2a2a2a;
  --gold:    #c9a96e;
  --gold2:   #e8d5b0;
  --text:    #f5f5f0;
  --muted:   #6b6b65;
  --muted2:  #4a4a45;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: 'Jost', sans-serif; font-weight: 300; overflow-x: hidden; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 200; display: flex; align-items: center; justify-content: space-between; padding: 0 48px; height: 72px; background: rgba(8,8,8,0.92); backdrop-filter: blur(24px); border-bottom: 1px solid var(--border); }
.logo { font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 26px; letter-spacing: 10px; color: var(--gold2); cursor: pointer; user-select: none; }
nav { display: flex; gap: 36px; position: absolute; left: 50%; transform: translateX(-50%); }
nav a { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); text-decoration: none; cursor: pointer; transition: color .25s; font-weight: 300; }
nav a:hover, nav a.active { color: var(--text); }
.header-right { display: flex; align-items: center; gap: 28px; }
.icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; transition: color .2s; display: flex; align-items: center; gap: 8px; }
.icon-btn:hover { color: var(--text); }
.icon-btn .cnt { background: var(--gold); color: #000; font-size: 9px; font-weight: 500; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.page { display: none; }
.page.active { display: block; }
.hero-banner { padding-top: 72px; height: 52vh; min-height: 360px; display: flex; align-items: flex-end; padding-bottom: 56px; padding-left: 48px; position: relative; overflow: hidden; background: linear-gradient(135deg, #0e0e0e 0%, #141410 100%); border-bottom: 1px solid var(--border); }
.hero-bg-text { position: absolute; right: -40px; top: 50%; transform: translateY(-50%); font-family: 'Cormorant Garamond', serif; font-size: clamp(120px,18vw,220px); font-weight: 300; font-style: italic; color: rgba(201,169,110,0.04); white-space: nowrap; pointer-events: none; letter-spacing: -4px; user-select: none; }
.hero-line { width: 32px; height: 1px; background: var(--gold); margin-bottom: 16px; }
.hero-tag { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; font-weight: 400; }
.hero-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(40px,6vw,76px); font-weight: 300; line-height: 1.05; letter-spacing: 2px; }
.hero-title em { font-style: italic; color: var(--gold2); }
.toolbar { display: flex; align-items: center; justify-content: space-between; padding: 20px 48px; border-bottom: 1px solid var(--border); gap: 16px; flex-wrap: wrap; }
.filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 6px 18px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; font-weight: 400; background: transparent; border: 1px solid var(--border2); color: var(--muted); cursor: pointer; transition: all .2s; font-family: 'Jost', sans-serif; }
.chip:hover { border-color: var(--muted2); color: var(--text); }
.chip.active { border-color: var(--gold); color: var(--gold); }
.sort-select { background: transparent; border: 1px solid var(--border2); color: var(--muted); padding: 6px 12px; font-family: 'Jost', sans-serif; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; outline: none; }
.sort-select option { background: var(--bg2); }
.catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1px; background: var(--border); }
.prod-card { background: var(--bg); cursor: pointer; position: relative; overflow: hidden; transition: background .25s; }
.prod-card:hover { background: var(--bg2); }
.card-media { position: relative; height: 360px; background: var(--bg3); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.card-photo { width: 100%; height: 100%; object-fit: cover; transition: transform .5s cubic-bezier(.34,1.56,.64,1); }
.prod-card:hover .card-photo { transform: scale(1.05); }
.card-placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: var(--bg3); color: var(--muted2); }
.ph-icon { font-size: 48px; opacity: .3; }
.ph-text { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; opacity: .4; }
.card-badge { position: absolute; top: 18px; left: 18px; font-size: 9px; letter-spacing: 2.5px; text-transform: uppercase; font-weight: 500; padding: 5px 12px; z-index: 2; }
.badge-new { background: var(--gold); color: #000; }
.badge-sale { background: #8b0000; color: #fff; }
.badge-exclusive { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
.card-wishlist { position: absolute; top: 14px; right: 16px; background: none; border: none; font-size: 18px; cursor: pointer; color: var(--muted2); transition: all .2s; opacity: 0; z-index: 2; }
.prod-card:hover .card-wishlist { opacity: 1; }
.card-wishlist:hover { color: #c00; transform: scale(1.2); }
.card-wishlist.wactive { color: #c00; opacity: 1; }
.card-cta { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 20px 16px; background: linear-gradient(transparent, rgba(8,8,8,.97)); transform: translateY(100%); transition: transform .35s cubic-bezier(.4,0,.2,1); display: flex; gap: 8px; z-index: 2; }
.prod-card:hover .card-cta { transform: translateY(0); }
.btn-cs { flex: 1; background: var(--gold); color: #000; border: none; padding: 11px; font-family: 'Jost', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; }
.btn-cs:hover { background: var(--gold2); }
.btn-vs { background: transparent; border: 1px solid var(--border2); color: var(--muted); padding: 11px 14px; font-family: 'Jost', sans-serif; font-size: 10px; cursor: pointer; }
.btn-vs:hover { border-color: var(--muted); color: var(--text); }
.card-sizes { position: absolute; bottom: 64px; left: 20px; display: flex; gap: 4px; opacity: 0; transition: opacity .3s; z-index: 2; }
.prod-card:hover .card-sizes { opacity: 1; }
.size-dot { font-size: 9px; color: var(--muted); background: rgba(8,8,8,.8); border: 1px solid var(--border2); padding: 3px 6px; letter-spacing: 1px; }
.card-body { padding: 18px 20px 22px; border-top: 1px solid var(--border); }
.card-cat { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
.card-name { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 400; margin-bottom: 4px; line-height: 1.2; }
.card-sub { font-size: 11px; color: var(--muted); margin-bottom: 12px; }
.card-price-row { display: flex; align-items: baseline; justify-content: space-between; }
.card-price { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; letter-spacing: 1px; }
.card-price-old { font-size: 12px; color: var(--muted2); text-decoration: line-through; margin-left: 8px; font-family: 'Jost', sans-serif; font-weight: 200; }
.card-rating { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.star { color: var(--gold); }
.color-swatches { display: flex; gap: 5px; margin-top: 10px; }
.swatch { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--border2); cursor: pointer; transition: transform .15s; }
.swatch:hover { transform: scale(1.3); }
.product-layout { display: grid; grid-template-columns: 55% 1fr; min-height: calc(100vh - 72px); margin-top: 72px; }
.gallery-side {
  position: sticky; top: 72px; height: calc(100vh - 72px);
  display: grid; grid-template-columns: 90px 1fr;
  background: var(--bg3); border-right: 1px solid var(--border);
}
.thumb-col {
  display: flex; flex-direction: column; gap: 1px;
  background: var(--border); border-right: 1px solid var(--border);
  overflow-y: auto;
}
.thumb-item {
  flex: 1; min-height: 0;
  background: var(--bg3);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 5px;
  cursor: pointer; transition: background .2s;
  overflow: hidden; position: relative;
}
.thumb-item:hover { background: var(--bg2); }
.thumb-item.active { background: var(--bg); box-shadow: inset 3px 0 0 var(--gold); }
.thumb-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb-gif-label {
  position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%);
  background: var(--gold); color: #000;
  font-size: 8px; font-weight: 500; letter-spacing: 1.5px;
  padding: 2px 6px; pointer-events: none; text-transform: uppercase;
}
.gif-badge {
  position: absolute; top: 16px; right: 16px; z-index: 3;
  background: var(--gold); color: #000;
  font-size: 10px; font-weight: 500; letter-spacing: 2px;
  padding: 4px 10px; text-transform: uppercase;
  animation: pulse 1.8s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
.thumb-ph { font-size: 22px; opacity: .25; }
.thumb-num { font-size: 9px; letter-spacing: 1px; color: var(--muted2); text-transform: uppercase; opacity: .6; }
.main-img {
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
  background: radial-gradient(ellipse at 40% 60%, #1a1710 0%, var(--bg3) 70%);
}
.main-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.main-img img.is-gif { object-fit: contain; background: #0a0a0a; }
.main-ph { display: flex; flex-direction: column; align-items: center; gap: 14px; color: var(--muted2); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }
.main-ph .big-icon { font-size: 80px; opacity: .2; }
.info-side { padding: 52px 48px; overflow-y: auto; max-height: calc(100vh - 72px); border-left: 1px solid var(--border); }
.breadcrumb { display: flex; align-items: center; gap: 8px; margin-bottom: 28px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.breadcrumb span { cursor: pointer; transition: color .2s; }
.breadcrumb span:hover { color: var(--text); }
.breadcrumb .sep { color: var(--muted2); }
.p-tag { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; font-weight: 400; }
.p-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(32px,3.5vw,50px); font-weight: 300; line-height: 1.05; margin-bottom: 6px; letter-spacing: 1px; }
.p-subtitle { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px; color: var(--muted); margin-bottom: 22px; font-weight: 300; }
.p-rating-row { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; padding-bottom: 28px; border-bottom: 1px solid var(--border); }
.p-stars { color: var(--gold); font-size: 14px; letter-spacing: 3px; }
.p-rating-num { font-family: 'Cormorant Garamond', serif; font-size: 18px; }
.p-reviews { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
.p-price-block { margin-bottom: 32px; }
.p-price { font-family: 'Cormorant Garamond', serif; font-size: 44px; font-weight: 300; letter-spacing: 2px; }
.p-price-old { font-size: 16px; color: var(--muted2); text-decoration: line-through; margin-left: 12px; font-family: 'Jost', sans-serif; font-weight: 200; }
.p-price-note { font-size: 11px; color: var(--muted); margin-top: 6px; letter-spacing: 1px; }
.opt-group { margin-bottom: 28px; }
.opt-label { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.opt-label a { color: var(--gold); cursor: pointer; font-size: 9px; letter-spacing: 2px; }
.size-grid { display: flex; gap: 8px; flex-wrap: wrap; }
.size-btn { min-width: 52px; height: 44px; background: transparent; border: 1px solid var(--border2); color: var(--text); font-family: 'Jost', sans-serif; font-size: 12px; font-weight: 300; letter-spacing: 1px; cursor: pointer; transition: all .2s; }
.size-btn:hover { border-color: var(--gold); }
.size-btn.sel { border-color: var(--gold); color: var(--gold); background: rgba(201,169,110,.06); }
.size-btn.out { opacity: .28; cursor: not-allowed; text-decoration: line-through; }
.color-grid { display: flex; gap: 10px; flex-wrap: wrap; }
.color-pick { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
.color-circle { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; transition: border-color .2s; position: relative; }
.color-pick.sel .color-circle { border-color: var(--gold); }
.color-pick.sel .color-circle::after { content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; mix-blend-mode: difference; }
.color-name { font-size: 9px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.disclaimer-note {
  display: flex; align-items: flex-start; gap: 10px;
  font-size: 11px; color: var(--muted); line-height: 1.6; letter-spacing: .3px;
  padding: 12px 14px; margin-bottom: 16px;
  border: 1px solid var(--border); border-left: 2px solid var(--gold);
  background: rgba(201,169,110,.03);
}
.disclaimer-icon { color: var(--gold); font-size: 13px; font-weight: 500; flex-shrink: 0; line-height: 1.6; }
.disclaimer-link {
  color: var(--gold); cursor: pointer; text-decoration: underline;
  text-underline-offset: 3px; text-decoration-color: rgba(201,169,110,.4);
  transition: text-decoration-color .2s;
}
.disclaimer-link:hover { text-decoration-color: var(--gold); }
.cta-group { display: grid; grid-template-columns: 1fr 52px; gap: 8px; margin-bottom: 20px; }
.btn-add { background: var(--gold); color: #000; border: none; padding: 16px; font-family: 'Jost', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; transition: background .25s; }
.btn-add:hover { background: var(--gold2); }
.btn-fav { background: transparent; border: 1px solid var(--border2); color: var(--muted); font-size: 18px; cursor: pointer; transition: all .2s; }
.btn-fav:hover { border-color: #c00; color: #c00; }
.delivery-note { display: flex; gap: 8px; align-items: flex-start; font-size: 11px; color: var(--muted); letter-spacing: .5px; line-height: 1.6; margin-bottom: 32px; padding: 14px 16px; border: 1px solid var(--border); background: rgba(201,169,110,.02); }
.accordion { border-top: 1px solid var(--border); }
.acc-item { border-bottom: 1px solid var(--border); }
.acc-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; cursor: pointer; user-select: none; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); transition: color .2s; }
.acc-head:hover, .acc-head.open { color: var(--text); }
.acc-icon { font-size: 14px; transition: transform .3s; color: var(--gold); }
.acc-head.open .acc-icon { transform: rotate(45deg); }
.acc-body { display: none; padding-bottom: 20px; }
.acc-body.open { display: block; }
.spec-row { display: flex; font-size: 12px; line-height: 1.4; padding: 9px 0; border-bottom: 1px solid var(--border); }
.spec-row:last-child { border-bottom: none; }
.spec-k { color: var(--muted); width: 44%; flex-shrink: 0; font-weight: 300; }
.spec-v { color: var(--text); font-weight: 300; }
.bundle-list { display: flex; flex-direction: column; gap: 10px; }
.bundle-row { display: flex; align-items: center; gap: 14px; font-size: 12px; }
.bundle-icon-wrap { width: 36px; height: 36px; background: var(--bg3); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.bundle-nm { font-weight: 300; font-size: 12px; }
.bundle-q { color: var(--muted); font-size: 10px; letter-spacing: 1px; margin-top: 2px; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 500; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .25s; backdrop-filter: blur(8px); }
.modal-overlay.show { opacity: 1; pointer-events: all; }
.modal { background: var(--bg2); border: 1px solid var(--border2); padding: 40px; max-width: 500px; width: 90%; transform: translateY(20px); transition: transform .3s; }
.modal-overlay.show .modal { transform: translateY(0); }
.modal-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; margin-bottom: 24px; letter-spacing: 2px; }
.size-table { width: 100%; font-size: 12px; border-collapse: collapse; }
.size-table th, .size-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-weight: 300; }
.size-table th { color: var(--muted); letter-spacing: 2px; font-size: 10px; text-transform: uppercase; }
.modal-close { background: none; border: 1px solid var(--border2); color: var(--muted); padding: 8px 20px; font-family: 'Jost', sans-serif; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; margin-top: 24px; transition: all .2s; }
.modal-close:hover { border-color: var(--gold); color: var(--gold); }
/* ── ОТЗЫВЫ ─────────────────────────────── */
.reviews-list { display: flex; flex-direction: column; gap: 0; }
.review-item { padding: 20px 0; border-bottom: 1px solid var(--border); }
.review-item:last-child { border-bottom: none; }
.review-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; gap: 12px; flex-wrap: wrap; }
.review-author { font-size: 12px; font-weight: 400; letter-spacing: 1px; color: var(--text); }
.review-date { font-size: 10px; color: var(--muted2); letter-spacing: 1px; }
.review-stars { color: var(--gold); font-size: 11px; letter-spacing: 2px; margin-bottom: 8px; }
.review-text { font-size: 12px; color: var(--muted); line-height: 1.8; font-weight: 300; margin-bottom: 12px; }
.review-photos { display: flex; gap: 8px; flex-wrap: wrap; }
.review-photo { width: 72px; height: 72px; object-fit: cover; cursor: pointer; border: 1px solid var(--border2);
  transition: border-color .2s, transform .2s; }
.review-photo:hover { border-color: var(--gold); transform: scale(1.04); }
.reviews-empty { font-size: 12px; color: var(--muted2); letter-spacing: 1px; padding: 12px 0; }
/* ── ЛАЙТБОКС ───────────────────────────── */
.lightbox { position: fixed; inset: 0; z-index: 800; background: rgba(0,0,0,.93);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .25s; backdrop-filter: blur(12px); }
.lightbox.show { opacity: 1; pointer-events: all; }
.lightbox img { max-width: 90vw; max-height: 88vh; object-fit: contain;
  border: 1px solid var(--border2); display: block; }
.lightbox-close { position: absolute; top: 24px; right: 28px;
  background: none; border: 1px solid var(--border2); color: var(--muted);
  font-size: 18px; line-height: 1; padding: 6px 12px; cursor: pointer;
  font-family: 'Jost', sans-serif; transition: all .2s; }
.lightbox-close:hover { border-color: var(--gold); color: var(--gold); }
/* ─────────────────────────────────────────── */
.toast { position: fixed; bottom: 32px; right: 32px; z-index: 900; background: var(--bg2); border: 1px solid var(--gold); padding: 16px 24px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold2); transform: translateY(60px); opacity: 0; transition: all .4s cubic-bezier(.34,1.56,.64,1); pointer-events: none; }
.toast.show { transform: translateY(0); opacity: 1; }
@media (max-width: 900px) {
  header { padding: 0 20px; } nav { display: none; }
  .hero-banner { padding: 88px 20px 40px; } .toolbar { padding: 16px 20px; }
  .product-layout { grid-template-columns: 1fr; }
  .gallery-side { position: relative; top: 0; height: 380px; grid-template-columns: 64px 1fr; }
  .info-side { max-height: none; padding: 32px 20px; }
}
</style>
</head>
<body>

<header>
  <div class="logo" onclick="showPage('catalog')">NOIRE</div>
  <nav>
    <a class="active" onclick="showPage('catalog')">Коллекция</a>
    <a onclick="showPage('catalog')">Новинки</a>
    <a onclick="showPage('catalog')">Женские</a>
    <a onclick="showPage('catalog')">Аксессуары</a>
  </nav>
  <div class="header-right">
    <button class="icon-btn" onclick="showToast('Поиск недоступен')">Поиск</button>
    <button class="icon-btn" data-wish onclick="showToast('Избранное пусто')">Избранное</button>
    <button class="icon-btn" onclick="showToast('Корзина пуста')">Корзина <span class="cnt" id="cartCnt">0</span></button>
  </div>
</header>

<div class="page active" id="catalogPage">
  <div class="hero-banner">
    <div class="hero-bg-text">Collection</div>
    <div>
      <div class="hero-line"></div>
      <div class="hero-tag">Осень / Зима 2025</div>
      <h1 class="hero-title">Новая<br><em>коллекция</em></h1>
    </div>
  </div>
  <div class="toolbar">
    <div class="filter-group">
      <button class="chip active" onclick="setFilter('all',this)">Всё</button>
      <button class="chip" onclick="setFilter('Повседневное',this)">Повседневное</button>
      <button class="chip" onclick="setFilter('Тусовочное',this)">Тусовочное</button>
      <button class="chip" onclick="setFilter('Брюки & Джинсы',this)">Брюки</button>
      <button class="chip" onclick="setFilter('Обувь',this)">Обувь</button>

/* ══ КОД НИЖЕ — НЕ ТРОГАЙ ══ */
let currentFilter = 'all', cartCount = 0, currentSort = 'default';

function getMediaSlots(p) {
  return [
    { src: p.photo1 || '', isGif: false, label: '1' },
    { src: p.photo2 || '', isGif: false, label: '2' },
    { src: p.photo3 || '', isGif: false, label: '3' },
    { src: p.photo4 || '', isGif: false, label: '4' },
    { src: p.gif    || '', isGif: true,  label: 'GIF' },
  ];
}

function makeMedia(src, cssClass) {
  if (src && src.trim()) {
    return `<img src="${src}" class="${cssClass}" onerror="this.outerHTML='<div class=card-placeholder><div class=ph-icon>📷</div><div class=ph-text>Нет фото</div></div>'">`;
  }
  return `<div class="card-placeholder"><div class="ph-icon">📷</div><div class="ph-text">Нет фото</div></div>`;
}

function getList() {
  let list = currentFilter === 'all' ? [...products] : products.filter(p => p.category === currentFilter);
  if (currentSort === 'priceLow')  list.sort((a,b) => a.priceNum - b.priceNum);
  if (currentSort === 'priceHigh') list.sort((a,b) => b.priceNum - a.priceNum);
  if (currentSort === 'rating')    list.sort((a,b) => b.rating - a.rating);
  return list;
}

function renderCatalog() {
  document.getElementById('catalogGrid').innerHTML = getList().map(p => {
    const swatches = p.colors.map(c => `<div class="swatch" style="background:${c.hex}" title="${c.name}"></div>`).join('');

    <div class="prod-card" onclick="openProduct(${p.id})">
      ${p.badge ? `<span class="card-badge badge-${p.badge}">${p.badgeText}</span>` : ''}
      <button class="card-wishlist ${getWishlist().includes(p.id)?'wactive':''}" onclick="event.stopPropagation();toggleWish(this,${p.id})">${getWishlist().includes(p.id)?'♥':'♡'}</button>
      <div class="card-media">
        ${makeMedia(p.photo1, 'card-photo')}
        <div class="card-sizes">${sizePreview}</div>
        <div class="card-cta">
          <button class="btn-cs" onclick="event.stopPropagation();addCart()">В корзину</button>
          <button class="btn-vs" onclick="event.stopPropagation();openProduct(${p.id})">→</button>
        </div>
      </div>
      <div class="card-body">
        <div class="card-cat">${p.category}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-sub">${p.subtitle}</div>
        <div class="card-price-row">
          <div>
            <span class="card-price">${p.price} ₽</span>
            ${p.priceOld ? `<span class="card-price-old">${p.priceOld} ₽</span>` : ''}
          </div>
          <div class="card-rating"><span class="star">★</span> ${p.rating} <span style="color:var(--muted2)">(${Array.isArray(p.reviews) ? p.reviews.length : (p.reviewCount||0)})</span></div>
        </div>
        <div class="color-swatches">${swatches}</div>
      </div>
    </div>`;
  }).join('');
}

    if (s.src) {
      return `<div class="thumb-item ${active}" ${srcAttr} ${gifAttr} onclick="selectThumb(this)">
        <img src="${s.src}" onerror="this.outerHTML='<div class=thumb-ph>📷</div>'">
        ${s.isGif ? '<span class="thumb-gif-label">GIF</span>' : ''}

      ${p.badge ? `<span class="card-badge badge-${p.badge}" style="position:static;font-size:9px">${p.badgeText}</span>` : ''}
    </div>
    <div class="p-price-block">
      <div>
        <span class="p-price">${p.price} ₽</span>
        ${p.priceOld ? `<span class="p-price-old">${p.priceOld} ₽</span>` : ''}
      </div>
      <div class="p-price-note">Включая НДС · Бесплатная доставка от 5 000 ₽</div>

      <div class="color-grid">
        ${p.colors.map((c,i) => `<div class="color-pick ${i===0?'sel':''}" onclick="pickColor(this)"><div class="color-circle" style="background:${c.hex}"></div><div class="color-name">${c.name}</div></div>`).join('')}

    </div>

      <div class="opt-label">
        <span>Размер</span>
        ${isClothing ? `<a onclick="openSizeModal()">Таблица размеров →</a>` : ''}
      </div>
      <div class="size-grid">
        ${p.sizes.map(s => { const out=p.outSizes.includes(s); return `<button class="size-btn${out?' out':''}" ${out?'disabled':''} onclick="pickSize(this)">${s}</button>`; }).join('')}
      </div>
      ${p.outSizes.length ? `<div style="font-size:10px;color:var(--muted);margin-top:10px;letter-spacing:1px">Зачёркнутые — нет в наличии</div>` : ''}
    </div>
    <div class="disclaimer-note">
      <span class="disclaimer-icon">ℹ</span>

    <div class="cta-group">

        <div class="acc-head" onclick="toggleAcc(this)">Характеристики <span class="acc-icon">+</span></div>

        <div class="acc-body"><div class="bundle-list">${p.bundle.map(b=>`<div class="bundle-row"><div class="bundle-icon-wrap">${b.icon}</div><div><div class="bundle-nm">${b.name}</div><div class="bundle-q">${b.qty}</div></div></div>`).join('')}</div></div>

      <div class="acc-item">
        <div class="acc-head" onclick="toggleAcc(this)">Отзывы ${(p.reviews||[]).length ? `<span style="color:var(--gold);font-size:10px;margin-left:6px">${p.reviews.length}</span>` : ''} <span class="acc-icon">+</span></div>

function setMainImg(src, isGif) {
  const mi = document.getElementById('mainImg');
  if (src) {
    const cls = isGif ? 'is-gif' : '';
    const badge = isGif ? '<span class="gif-badge">GIF</span>' : '';
    mi.innerHTML = `${badge}<img src="${src}" class="${cls}" style="width:100%;height:100%;" onerror="this.outerHTML='<div class=main-ph><div class=big-icon>📷</div><div>Файл не найден</div></div>'">`;
  } else {
    mi.innerHTML = `<div class="main-ph"><div class="big-icon">${isGif ? '▶' : '📷'}</div><div>${isGif ? 'GIF не добавлен' : 'Фото не добавлено'}</div></div>`;
  }
}

function renderReviews(reviews) {
  if (!reviews || !reviews.length) return '<div class="reviews-empty">Отзывов пока нет</div>';
  return `<div class="reviews-list">${reviews.map(r => {
    const stars = '★'.repeat(Math.max(1,Math.min(5,r.stars||5))) + '★'.repeat(5-(r.stars||5)).replace(/./g,'☆');
    const photos = (r.photos||[]).slice(0,3).map(src =>
      `<img src="${src}" class="review-photo" onclick="openLightbox('${src}')" onerror="this.style.display='none'">`
    ).join('');
    return `<div class="review-item">
      <div class="review-header">
        <span class="review-author">${r.author||''}</span>
        <span class="review-date">${r.date||''}</span>
      </div>
      <div class="review-stars">${stars}</div>
      <div class="review-text">${r.text||''}</div>
      ${photos ? `<div class="review-photos">${photos}</div>` : ''}
    </div>`;
  }).join('')}</div>`;
}
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

function selectThumb(el) {
  document.querySelectorAll('.thumb-item').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  setMainImg(el.dataset.src || '', el.dataset.gif === '1');
}
function pickColor(el) {
  el.closest('.color-grid').querySelectorAll('.color-pick').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
  const l = document.getElementById('selClr');
  if (l) l.textContent = el.querySelector('.color-name').textContent;
}
function pickSize(btn) {
  btn.closest('.size-grid').querySelectorAll('.size-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}
function toggleAcc(h) { h.classList.toggle('open'); h.nextElementSibling.classList.toggle('open'); }
/* ── ИЗБРАННОЕ ───────────────────────────────── */
function getWishlist() {
  try { return JSON.parse(localStorage.getItem('noire_wish') || '[]'); } catch(e) { return []; }
}
function saveWishlist(list) {
  localStorage.setItem('noire_wish', JSON.stringify(list));
  updateWishIcon();
}
function updateWishIcon() {
  const n = getWishlist().length;
  const btn = document.querySelector('.icon-btn[data-wish]');
  if (btn) btn.innerHTML = `Избранное${n ? ` <span class="cnt" style="background:var(--gold);color:#000">${n}</span>` : ''}`;
}
/* toggleWish — кнопка ♥ в карточке каталога, data-id устанавливается в renderCatalog */
function toggleWish(btn, id) {
  let list = getWishlist();
  const idx = list.indexOf(id);
  if (idx === -1) { list.push(id); btn.classList.add('wactive'); btn.textContent = '♥'; showToast('Добавлено в избранное'); }
  else           { list.splice(idx,1); btn.classList.remove('wactive'); btn.textContent = '♡'; showToast('Удалено из избранного'); }
  saveWishlist(list);
}
/* toggleFav — кнопка ♥ на странице товара, читает data-id с кнопки */
function toggleFav(btn) {
  const id = parseInt(btn.dataset.id);
  let list = getWishlist();
  const idx = list.indexOf(id);
  if (idx === -1) { list.push(id); btn.textContent = '♥'; btn.style.color='#c00'; btn.style.borderColor='#c00'; showToast('Добавлено в избранное'); }
  else           { list.splice(idx,1); btn.textContent='♡'; btn.style.color=''; btn.style.borderColor=''; showToast('Удалено из избранного'); }
  saveWishlist(list);
}
/* ────────────────────────────────────────── */
function addCart() { cartCount++; document.getElementById('cartCnt').textContent = cartCount; showToast('Товар добавлен в корзину'); }
function setFilter(cat, btn) { currentFilter = cat; document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); btn.classList.add('active'); updateWishIcon();
renderCatalog(); }
function sortCatalog(val) { currentSort = val; renderCatalog(); }
function openSizeModal()  { document.getElementById('sizeModal').classList.add('show'); }
function closeSizeModal() { document.getElementById('sizeModal').classList.remove('show'); }
function showPage(name) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(name==='catalog'?'catalogPage':'productPage').classList.add('active');
  window.scrollTo(0,0);
}
let _tt;
function showToast(msg) {
  const el = document.getElementById('toastEl');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(()=>el.classList.remove('show'), 2600);
}

renderCatalog();
</script>
</body>
</html>
